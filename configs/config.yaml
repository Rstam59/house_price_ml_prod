data:
  url: "https://github.com/ageron/data/raw/main/housing.tgz"
  directory: "datasets"
  tarball_name: "housing.tgz"
  extracted_directory: "housing"
  csv_name: "housing.csv"

split:
  test_size: 0.2
  random_state: 42

  income_category:
    bins: 
      - 0.0
      - 1.5
      - 3.0
      - 4.5
      - 6.0
      - .inf
    
    labels:
      - 1
      - 2
      - 3
      - 4
      - 5

target:
  column: 'median_house_value'

model:
  type: 'random_forest'

  random_forest:
    n_estimators: 100
    max_depth: null
    random_state: 42
    n_jobs: -1

evaluation:
  cv_folds: 5
  scoring: "neg_root_mean_squared_error"


artifacts:
  directory: 'artifacts/models'
  model_filename: 'housing_pipeline.joblib'
  metadata_filename: 'metadata.json'

logging:
  level: 'INFO'

api:
  host: "0.0.0.0"
  port: 8000