[project]
name = "house-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{include = "house_ml", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    'E',
    'F',
    'I',
    'B'
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"